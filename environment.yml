name: SpecFerry
# Optional GPU verifier runtime is declared in requirements-tlm-runtime.txt.
# Its packages come from the pinned ARM64 container; the same SpecFerry Python
# 3.12 interpreter is mounted read-only. Do not mix it with the CPU profile below.
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - clang-format==18.1.8
      - -r requirements-reference.txt
      - -r requirements-download.txt
